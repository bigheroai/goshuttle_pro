# Netlify build configuration for the Vite + React app.
# netlify.toml values override the site's UI build settings,
# so this pins everything explicitly and avoids relying on
# framework auto-detection (which reported "Unknown").
# Python is not used by this build; NODE_VERSION pins the toolchain.
# Output: Vite writes to "build" (see vite.config.mjs outDir).

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: route all paths to index.html so React Router
# handles client-side navigation on refresh/deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
